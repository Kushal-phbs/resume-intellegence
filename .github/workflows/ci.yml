name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q
        env:
          APP_NAME: "CI Test"
          APP_VERSION: "0.0.0"
          ENVIRONMENT: "ci"
          DEBUG: "false"
          LLM_PROVIDER: "groq"
          GROQ_API_KEY: "ci-test-key-do-not-use"
          GROQ_MODEL: "ci-test-model"
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test"
          SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars!!"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          REDIS_ENABLED: "false"
          REDIS_URL: "redis://localhost:6379/0"
          CORS_ALLOW_ORIGINS: "http://localhost:3000"
          TRUSTED_HOSTS: "localhost,127.0.0.1,testserver"

      - name: Check Alembic migration state
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          alembic check
        env:
          APP_NAME: "CI Test"
          APP_VERSION: "0.0.0"
          ENVIRONMENT: "ci"
          DEBUG: "false"
          LLM_PROVIDER: "groq"
          GROQ_API_KEY: "ci-test-key-do-not-use"
          GROQ_MODEL: "ci-test-model"
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test"
          SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars!!"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          REDIS_ENABLED: "false"
          REDIS_URL: "redis://localhost:6379/0"
          CORS_ALLOW_ORIGINS: "http://localhost:3000"
          TRUSTED_HOSTS: "localhost,127.0.0.1,testserver"

      - name: Build Docker image
        run: docker build -t backend-ci -f backend/Dockerfile backend