[alembic]
# Path to migration scripts.
script_location = alembic

# Add the backend root to sys.path so the "app" package is importable
# from env.py without requiring installation.
prepend_sys_path = .

# Timezone-aware, sortable revision file names.
file_template = %%(year)04d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The sqlalchemy.url value below is intentionally left blank. env.py
# overrides it at runtime with settings.database_url so the connection
# string is only defined once, in the application's environment variables.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
