services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-resume_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resume_intelligence}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: resume-intelligence-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-intelligence-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Resume Intelligence}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: false
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-resume_intelligence}
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      CACHE_DASHBOARD_SUMMARY_TTL_SECONDS: ${CACHE_DASHBOARD_SUMMARY_TTL_SECONDS:-120}
      CACHE_DASHBOARD_STATISTICS_TTL_SECONDS: ${CACHE_DASHBOARD_STATISTICS_TTL_SECONDS:-120}
      CACHE_DASHBOARD_TRENDS_TTL_SECONDS: ${CACHE_DASHBOARD_TRENDS_TTL_SECONDS:-180}
      CACHE_DASHBOARD_PERFORMANCE_TTL_SECONDS: ${CACHE_DASHBOARD_PERFORMANCE_TTL_SECONDS:-120}
      CACHE_RESUME_ANALYSIS_TTL_SECONDS: ${CACHE_RESUME_ANALYSIS_TTL_SECONDS:-300}
      CACHE_JOB_ANALYSIS_TTL_SECONDS: ${CACHE_JOB_ANALYSIS_TTL_SECONDS:-300}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-10}
      RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-5}
      RATE_LIMIT_RESUME_UPLOAD_REQUESTS: ${RATE_LIMIT_RESUME_UPLOAD_REQUESTS:-20}
      RATE_LIMIT_RESUME_ANALYSIS_REQUESTS: ${RATE_LIMIT_RESUME_ANALYSIS_REQUESTS:-20}
      RATE_LIMIT_JOB_ANALYSIS_REQUESTS: ${RATE_LIMIT_JOB_ANALYSIS_REQUESTS:-20}
      RATE_LIMIT_RESUME_TAILORING_REQUESTS: ${RATE_LIMIT_RESUME_TAILORING_REQUESTS:-20}
      RATE_LIMIT_EXPORT_REQUESTS: ${RATE_LIMIT_EXPORT_REQUESTS:-40}
      RATE_LIMIT_DASHBOARD_REFRESH_REQUESTS: ${RATE_LIMIT_DASHBOARD_REFRESH_REQUESTS:-10}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-Authorization,Content-Type,X-Request-ID}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      RESUME_UPLOAD_DIR: ${RESUME_UPLOAD_DIR:-uploads/resumes}
      RESUME_MAX_UPLOAD_SIZE_MB: ${RESUME_MAX_UPLOAD_SIZE_MB:-5}
      RESUME_ALLOWED_EXTENSIONS: ${RESUME_ALLOWED_EXTENSIONS:-pdf,doc,docx}
      RESUME_ALLOWED_MIME_TYPES: ${RESUME_ALLOWED_MIME_TYPES:-application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    volumes:
      - resume_uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: resume-intelligence-postgres-data
  redis_data:
    name: resume-intelligence-redis-data
  resume_uploads:
    name: resume-intelligence-uploads
